<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0609">
<title>ХЕКЛ-РАННЕР — стендап Пермь</title>
<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; min-height:100%;
    background:#08050a; color:#f3ece6;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    overflow:hidden; overscroll-behavior:none;
  }
  body{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; min-height:100vh; min-height:100dvh; padding:8px;
    background: radial-gradient(120% 90% at 50% 0%, #2a0d12 0%, #12080c 45%, #07050a 100%);
  }
  canvas{
    display:block;
    max-width:100%;
    max-height:min(88vh, 1280px);
    border-radius:14px;
    background:#0a0609;
    box-shadow: 0 0 0 1px rgba(255,80,80,.18), 0 22px 60px rgba(0,0,0,.75);
    touch-action:none;
  }
  .touch-ui{ display:none; width:100%; max-width:520px; gap:10px; }
  .touch-ui.show{ display:flex; }
  .touch-ui button{
    flex:1; padding:16px 8px; border-radius:14px;
    border:1px solid rgba(255,255,255,.14);
    background:linear-gradient(180deg,#2a1116,#170a0e);
    color:#f6e9e4; font-size:15px; font-weight:800; letter-spacing:.06em;
    cursor:pointer; user-select:none;
  }
  .touch-ui button:active{ background:linear-gradient(180deg,#3d1620,#200d13); transform:translateY(1px); }
</style>
</head>
<body>

<canvas id="game" width="720" height="1280"></canvas>

<div class="touch-ui" id="touchUI">

</div>

/* --- утилиты --- */
function rand(a, b) { return a + Math.random() * (b - a); }
function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function rr(x, y, w, h, r) {
  r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function fitFont(text, maxW, startSize, weight, family) {
  var size = startSize;
  do {
    ctx.font = weight + ' ' + size + 'px ' + (family || 'system-ui, sans-serif');
    if (ctx.measureText(text).width <= maxW) break;
    size -= 2;
  } while (size > 10);
  return size;
}

var actx = null, master = null, musicBus = null, sfxBus = null, noiseBuf = null;
var muted = false;

function ensureAudio() {
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { return false; }
    master = actx.createGain();
    master.gain.value = muted ? 0 : 1;
    master.connect(actx.destination);
    musicBus = actx.createGain(); musicBus.gain.value = 0.19; musicBus.connect(master);
    sfxBus = actx.createGain();   sfxBus.gain.value = 0.85;   sfxBus.connect(master);
    noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
    var d = noiseBuf.getChannelData(0);
    for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (actx.state === 'suspended') actx.resume();
  return true;
}
function setMuted(v) {
  muted = v;
  if (master) master.gain.value = v ? 0 : 1;
  if (v && window.speechSynthesis) speechSynthesis.cancel();
}
function tone(freq, dur, type, vol, bus, slideTo, when) {
  var t0 = actx.currentTime + (when || 0);
  var o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(bus);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
function noise(dur, vol, bus, freq, when, q) {
  var t0 = actx.currentTime + (when || 0);
  var s = actx.createBufferSource();
  s.buffer = noiseBuf;
  var f = actx.createBiquadFilter();
  f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q || 1.1;
  var g = actx.createGain();
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  s.connect(f); f.connect(g); g.connect(bus);
  s.start(t0, Math.random() * 0.5); s.stop(t0 + dur + 0.02);
}

var SFX = {
  jump: function () { if (ensureAudio()) tone(340, 0.12, 'square', 0.05, sfxBus, 620); },
  swing: function () { if (ensureAudio()) noise(0.15, 0.2, sfxBus, 1400, 0, 0.8); },
  /* удар по предмету: щелчок + глухой деревянный корпус */
  deflect: function (combo) {
    if (!ensureAudio()) return;
    noise(0.045, 0.55, sfxBus, 1600, 0, 0.9);
    tone(210, 0.13, 'triangle', 0.5, sfxBus, 80);
    tone(150, 0.09, 'square', 0.16, sfxBus, 60, 0.01);
    tone(820 + Math.min(combo, 12) * 45, 0.05, 'sine', 0.1, sfxBus, 420);
  },
  hit: function () {
    if (!ensureAudio()) return;
    tone(260, 0.3, 'sawtooth', 0.14, sfxBus, 70);
    noise(0.22, 0.35, sfxBus, 600);
  },
  over: function () {
    if (!ensureAudio()) return;
    [392, 330, 262, 196].forEach(function (f, i) { tone(f, 0.28, 'square', 0.09, sfxBus, f * 0.9, i * 0.22); });
  },
  start: function () {
    if (!ensureAudio()) return;
    [523, 659, 784, 1046].forEach(function (f, i) { tone(f, 0.12, 'square', 0.08, sfxBus, null, i * 0.09); });
  }
};

var CROWD_LINES = ['Не смешно!', 'Отстой!', 'Лошара!', 'Кринж!', 'И это всё?'];
var ruVoice = null;
function pickVoice() {
  if (!window.speechSynthesis) return;
  var vs = speechSynthesis.getVoices();
  ruVoice = vs.find(function (v) { return /^ru/i.test(v.lang); }) || null;
}
if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

var shoutCd = 0;
function crowdGroan() {
  if (!ensureAudio()) return;
  var base = rand(115, 175);
  tone(base, 0.65, 'sawtooth', 0.06, sfxBus, base * 0.8);
  tone(base * 1.5, 0.55, 'triangle', 0.04, sfxBus, base * 1.2, 0.06);
  noise(0.65, 0.1, sfxBus, 900);
}
function shout(text) {
  if (muted || shoutCd > 0) return;
  shoutCd = 0.95;
  if (ruVoice) {
    var u = new SpeechSynthesisUtterance(text);
    u.voice = ruVoice; u.lang = ruVoice.lang;
    u.rate = rand(1.1, 1.45); u.pitch = rand(0.7, 1.45); u.volume = 0.9;
    speechSynthesis.speak(u);
  } else { crowdGroan(); }
}

var NOTE = { C2:65.41,A2:110,F2:87.31,G2:98,C3:130.81,A3:220,F3:174.61,G3:196,B3:246.94,
  C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392,A4:440,B4:493.88,
  C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99 };
var MEL = ['E5',null,'G5','C5','E5','G5',null,'E5',
           'A4',null,'C5','E5','A4','C5','E5',null,
           'F4','A4','C5','F5','E5',null,'C5','A4',
           'G4','B4','D5','G5','F5','D5','B4',null];
var BASS = ['C3','A2','F2','G2'];
var Music = {
  on: false, timer: null, step: 0, next: 0, bpm: 136,
  start: function () {
    if (this.on || !ensureAudio()) return;
    this.on = true;
    this.next = actx.currentTime + 0.06;
    var self = this;
    this.timer = setInterval(function () { self.schedule(); }, 25);
  },
  stop: function () { this.on = false; clearInterval(this.timer); },
  schedule: function () {
    var eighth = 60 / this.bpm / 2;
    while (this.next < actx.currentTime + 0.15) {
      var i = this.step % 32, bar = i >> 3, pos = i & 7;
      var when = this.next - actx.currentTime;
      var m = MEL[i];
      if (m) tone(NOTE[m], eighth * 0.8, 'square', 0.06, musicBus, null, when);
      if (pos % 2 === 0) {
        var root = NOTE[BASS[bar]];
        tone(root * (pos === 4 ? 1.5 : 1), eighth * 1.6, 'triangle', 0.22, musicBus, null, when);
      }
      if (pos === 0 || pos === 4) tone(120, 0.14, 'sine', 0.45, musicBus, 45, when);
      if (pos === 2 || pos === 6) noise(0.09, 0.16, musicBus, 2400, when);
      if (pos % 2 === 1) noise(0.03, 0.05, musicBus, 7000, when);
      this.next += eighth;
      this.step++;
    }
  }
};

var THROW_WORDS = ['НЕ СМЕШНО', 'ОТСТОЙ', 'ЛОШАРА', 'КРИНЖ', 'И ЭТО ВСЁ?'];
var DEFLECT_WORDS = ['ОТБИТО', 'ЩЁЛК', 'ЗАЛ ЛЕЖИТ', 'СЛЕДУЮЩИЙ', 'САМ ТЫ', 'В КОПИЛКУ', 'КРАСАВА'];

/* ============================================================
   СОСТОЯНИЕ
   ============================================================ */
var state = {
  mode: 'start',
  time: 0,
  speed: 0,
  score: 0,
  combo: 0,
  comboTimer: 0,
  best: Number(localStorage.getItem('heckle_best_phone') || 0),
  hp: 3,
  maxHp: 3,
  shake: 0,
  flash: 0,
  spawnObstacle: 1.0,
  spawnProjectile: 1.6
};

var player = {
  x: PLAYER_X, feetY: GROUND, vy: 0, onGround: true,
  swing: 0, swingCd: 0, inv: 0, runPhase: 0, hurt: 0
};

var obstacles = [], projectiles = [], particles = [], floats = [], bubbles = [];

/* ============================================================
   ЗАЛ
   ============================================================ */
var PHASES = [110, 70, 92, 128, 60, 104, 84];
var audience = [];
function buildAudience() {
  audience.length = 0;
  /* слева от комика зрителей нет: всё летит только в спину */
  var n = PORTRAIT ? 5 : 8;
  var span = W * 0.86;
  var startX = W * 0.28;
  for (var i = 0; i < n; i++) {
    audience.push({
      x: startX + (span / (n - 1)) * i + rand(-10, 10),
      y: H * 0.245 + rand(-16, 10),
      s: rand(0.82, 1.16) * U * 1.25,
      ph: Math.random() * 6.28,
      hue: pick(PHASES),
      throwT: 0
    });
  }
}
buildAudience();

/* ============================================================
   СПАВН
   ============================================================ */
var OBSTACLE_DEFS = [
  { type: 'mic',    w: 30,  h: 118 },
  { type: 'chair',  w: 74,  h: 66  },
  { type: 'bottle', w: 30,  h: 54  },
  { type: 'amp',    w: 66,  h: 78  }
];
function spawnObstacle() {
  var d = pick(OBSTACLE_DEFS);
  obstacles.push({ x: W + 80, w: d.w, h: d.h, type: d.type });
}
function spawnProjectile() {
  var src = pick(audience);
  var isBubble = Math.random() < 0.45;
  var sx = src.x + rand(-20, 20);
  var sy = src.y + 24;
  var tx = player.x + rand(-30, 30);
  var ty = player.feetY - PDH * 0.45;
  var dx = tx - sx, dy = ty - sy;
  var len = Math.hypot(dx, dy) || 1;
  var spd = (rand(330, 420) + Math.min(state.time * 6, 180)) * U;
  src.throwT = 0.28;

  var p;
  if (isBubble) {
    var text = pick(THROW_WORDS);
    p = { kind: 'bubble', text: text, x: sx, y: sy, vx: dx / len * spd * 0.82, vy: dy / len * spd * 0.82,
          r: 46 * U * 1.3, rot: rand(-0.15, 0.15), spin: rand(-0.6, 0.6), deflected: false };
    shout(text);
  } else {
    var isCan = Math.random() < 0.3;
    p = { kind: isCan ? 'can' : 'tomato', x: sx, y: sy, vx: dx / len * spd, vy: dy / len * spd,
          r: (isCan ? 18 : 21) * U * 1.3, rot: rand(0, 6.28), spin: rand(-7, 7), deflected: false };
  }
  projectiles.push(p);
}

/* ============================================================
   ЧАСТИЦЫ
   ============================================================ */
function burst(x, y, color, n, power) {
  for (var i = 0; i < n; i++) {
    var a = rand(0, 6.283), s = rand(60, 380) * (power || 1);
    particles.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 80,
      life: rand(0.35, 0.85), max: 0.85, size: rand(3, 9), color: color, grav: 900 });
  }
}
function addFloat(x, y, text, color, size) {
  floats.push({ x: x, y: y, text: text, color: color || '#ffd166', size: (size || 22) * U, life: 0.95, max: 0.95 });
}

/* ============================================================
   ВВОД
   ============================================================ */
function doJump() {
  if (state.mode === 'start' || state.mode === 'over') { startGame(); return; }
  if (state.mode !== 'play' || !player.onGround) return;
  player.vy = -1180;
  player.onGround = false;
  SFX.jump();
  burst(player.x, GROUND, 'rgba(255,220,200,.55)', 6, 0.5);
}
function doSwing() {
  if (state.mode !== 'play' || player.swingCd > 0) return;
  player.swing = 0.22;
  player.swingCd = 0.32;
  SFX.swing();
}

window.addEventListener('keydown', function (e) {
  var k = e.key.toLowerCase();
  if ([' ', 'arrowup', 'w', 'arrowdown', 's', 'p', 'r', 'enter', 'm'].indexOf(k) >= 0) e.preventDefault();
  if (k === ' ' || k === 'arrowup' || k === 'w' || k === 'enter') doJump();
  else if (k === 'arrowdown' || k === 's' || k === 'shift') doSwing();
  else if (k === 'p') togglePause();
  else if (k === 'r') startGame();
  else if (k === 'm') setMuted(!muted);
}, { passive: false });

cvs.addEventListener('pointerdown', function (e) {
  ensureAudio();
  var rect = cvs.getBoundingClientRect();
  var px = (e.clientX - rect.left) / rect.width;
  var py = (e.clientY - rect.top) / rect.height;

  if (state.mode === 'start' || state.mode === 'over') {
    if (px > 0.76 && py < 0.13) { setMuted(!muted); return; }
    startGame();
    return;
  }
  if (state.mode === 'pause') { togglePause(); return; }
  if (px > 0.5) doSwing(); else doJump();
});

var btnJump = document.getElementById('btnJump');
var btnHit = document.getElementById('btnHit');
btnJump.addEventListener('pointerdown', function (e) { e.preventDefault(); ensureAudio(); doJump(); });
btnHit.addEventListener('pointerdown', function (e) { e.preventDefault(); ensureAudio(); doSwing(); });
if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
  document.getElementById('touchUI').classList.add('show');
}

/* ============================================================
   ПОТОК ИГРЫ
   ============================================================ */
function startGame() {
  state.mode = 'play';
  state.time = 0;
  state.score = 0;
  state.combo = 0;
  state.comboTimer = 0;
  state.hp = state.maxHp;
  state.shake = 0;
  state.flash = 0;
  state.spawnObstacle = 1.0;
  state.spawnProjectile = 1.6;
  obstacles = []; projectiles = []; particles = []; floats = []; bubbles = [];
  player.feetY = GROUND; player.vy = 0; player.onGround = true;
  player.swing = 0; player.swingCd = 0; player.inv = 0; player.hurt = 0;
  SFX.start();
  Music.start();
}
function togglePause() {
  if (state.mode === 'play') { state.mode = 'pause'; Music.stop(); }
  else if (state.mode === 'pause') { state.mode = 'play'; Music.start(); }
}
function gameOver() {
  state.mode = 'over';
  state.shake = 22;
  SFX.over();
  Music.stop();
  if (state.score > state.best) {
    state.best = Math.floor(state.score);
    localStorage.setItem('heckle_best_phone', String(state.best));
  }
  burst(player.x, player.feetY - PDH * 0.5, '#ff6b6b', 40, 1.4);
}
function hurt() {
  if (player.inv > 0) return;
  state.hp -= 1;
  state.shake = 16;
  state.flash = 0.5;
  state.combo = 0;
  player.inv = 1.3;
  player.hurt = 0.4;
  SFX.hit();
  shout(pick(['Слабо!', 'Фу!', 'Кринж!']));
  burst(player.x, player.feetY - PDH * 0.5, '#ff4d4d', 22, 1.1);
  addFloat(player.x, player.feetY - PDH * 1.15, pick(['ОЙ', 'АЙ', 'ПРОСТИТЕ']), '#ff8a8a', 26);
  if (state.hp <= 0) gameOver();
}

/* ============================================================
   ОБНОВЛЕНИЕ
   ============================================================ */
function micHeadPos() {
  var k = player.swing > 0 ? Math.sin((1 - player.swing / 0.22) * Math.PI) : 0;
  return armPose(k).head;
}

function update(dt) {
  state.shake = Math.max(0, state.shake - dt * 55);
  state.flash = Math.max(0, state.flash - dt * 2.2);
  if (shoutCd > 0) shoutCd -= dt;

  if (Math.random() < dt * 10) {
    particles.push({ x: rand(0, W), y: rand(H * 0.2, GROUND - 40), vx: rand(-14, 14), vy: rand(-26, -6),
      life: rand(1.2, 2.4), max: 2.4, size: rand(1, 2.6), color: 'rgba(255,190,170,.20)', grav: -6 });
  }
  for (var bi = bubbles.length - 1; bi >= 0; bi--) {
    var bb = bubbles[bi]; bb.life -= dt; bb.y -= dt * 22;
    if (bb.life <= 0) bubbles.splice(bi, 1);
  }
  if (Math.random() < dt * 0.55) {
    var aa = pick(audience);
    bubbles.push({ x: aa.x + rand(-20, 20), y: aa.y - 34, text: pick(THROW_WORDS), life: 2.2, max: 2.2, size: rand(13, 17) * U * 1.3 });
  }
  for (var ai = 0; ai < audience.length; ai++) audience[ai].throwT = Math.max(0, audience[ai].throwT - dt);

  for (var pi = particles.length - 1; pi >= 0; pi--) {
    var p = particles[pi];
    p.life -= dt; p.vy += (p.grav || 900) * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.life <= 0) particles.splice(pi, 1);
  }
  if (particles.length > 420) particles.splice(0, particles.length - 420);
  for (var fi = floats.length - 1; fi >= 0; fi--) {
    var f = floats[fi]; f.life -= dt; f.y -= dt * 46;
    if (f.life <= 0) floats.splice(fi, 1);
  }

  if (state.mode !== 'play') return;

  state.time += dt;
  Music.bpm = 136 + Math.min(state.time * 0.6, 24);
  state.speed = Math.min(380 + state.time * 8, 760) * U;
  state.score += dt * (11 + state.time * 0.55) * (1 + state.combo * 0.05);

  player.vy += 3400 * dt;
  player.feetY += player.vy * dt;
  if (player.feetY >= GROUND) {
    if (!player.onGround) burst(player.x, GROUND, 'rgba(255,235,215,.5)', 5, 0.45);
    player.feetY = GROUND; player.vy = 0; player.onGround = true;
  }
  player.runPhase += dt * (state.speed / 60 / U);
  if (player.swing > 0) player.swing -= dt;
  if (player.swingCd > 0) player.swingCd -= dt;
  if (player.inv > 0) player.inv -= dt;
  if (player.hurt > 0) player.hurt -= dt;
  if (state.comboTimer > 0) { state.comboTimer -= dt; if (state.comboTimer <= 0) state.combo = 0; }

  /* удар микрофоном */
  if (player.swing > 0) {
    var mh = micHeadPos();
    var R = 118 * U * 1.35;
    for (var i2 = 0; i2 < projectiles.length; i2++) {
      var pr = projectiles[i2];
      if (pr.deflected) continue;
      if (Math.hypot(pr.x - mh.x, pr.y - mh.y) < R + pr.r) {
        pr.deflected = true;
        pr.vx = rand(520, 780) * U * 1.2;
        pr.vy = rand(-720, -520) * U * 1.2;
        pr.spin = rand(-14, 14);
        state.combo += 1;
        state.comboTimer = 2.6;
        var mult = 1 + Math.floor(state.combo / 3) * 0.5;
        state.score += 55 * mult;
        SFX.deflect(state.combo);
        burst(pr.x, pr.y, pr.kind === 'bubble' ? '#ffe08a' : '#ff5252', 12, 0.9);
        addFloat(pr.x, pr.y - 10, pick(DEFLECT_WORDS) + (mult > 1 ? ' x' + mult : ''), '#ffe08a', 20);
      }
    }
  }

  /* препятствия */
  for (var oi = obstacles.length - 1; oi >= 0; oi--) {
    var o = obstacles[oi];
    o.x -= state.speed * dt;
    if (o.x + o.w < -60) { obstacles.splice(oi, 1); continue; }
    var bx = player.x - PDW * 0.22, by = player.feetY - PDH * 0.92;
    var bw = PDW * 0.44, bh = PDH * 0.92;
    var ox = o.x, oy = GROUND - o.h;
    if (bx + bw - 6 > ox && bx + 6 < ox + o.w && by + bh - 8 > oy && by + 6 < oy + o.h) {
      hurt();
      o.x -= 30;
    }
  }

  /* снаряды */
  for (var pj = projectiles.length - 1; pj >= 0; pj--) {
    var q = projectiles[pj];
    q.x += q.vx * dt; q.y += q.vy * dt; q.rot += q.spin * dt;
    if (q.deflected) {
      q.vy += 900 * dt;
      if (q.y < -120 || q.x > W + 160) { projectiles.splice(pj, 1); }
    } else {
      if (Math.abs(q.x - player.x) < PDW * 0.3 + q.r * 0.72 &&
          q.y > player.feetY - PDH * 1.0 && q.y < player.feetY - 4) {
        projectiles.splice(pj, 1); hurt(); continue;
      }
      if (q.x < -160 || q.y > GROUND + 140) { projectiles.splice(pj, 1); }
    }
  }

  /* спавн */
  state.spawnObstacle -= dt;
  if (state.spawnObstacle <= 0) {
    spawnObstacle();
    var b1 = clamp(2.0 - state.time * 0.010, 1.25, 2.0);
    state.spawnObstacle = b1 * rand(0.9, 1.25);
  }
  state.spawnProjectile -= dt;
  if (state.spawnProjectile <= 0) {
    spawnProjectile();
    var b2 = clamp(2.7 - state.time * 0.014, 1.5, 2.7);
    state.spawnProjectile = b2 * rand(0.82, 1.3);
  }
}

/* ============================================================
   ФОН
   ============================================================ */
function drawBackground(t) {
  var bg = ctx.createLinearGradient(0, 0, 0, GROUND);
  bg.addColorStop(0, '#1a0509');
  bg.addColorStop(0.55, '#3a0a10');
  bg.addColorStop(1, '#54101a');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, GROUND + 4);

  var foldW = 92 * U;
  for (var x = -foldW; x < W + foldW; x += foldW) {
    var g = ctx.createLinearGradient(x, 0, x + foldW, 0);
    g.addColorStop(0, 'rgba(0,0,0,.34)');
    g.addColorStop(0.42, 'rgba(255,90,70,.055)');
    g.addColorStop(0.62, 'rgba(0,0,0,.06)');
    g.addColorStop(1, 'rgba(0,0,0,.36)');
    ctx.fillStyle = g;
    ctx.fillRect(x, 0, foldW, GROUND);
  }

  var spot = ctx.createRadialGradient(W * 0.5, 40, 60, W * 0.5, 40, W * 0.62);
  spot.addColorStop(0, 'rgba(255,214,170,.16)');
  spot.addColorStop(0.45, 'rgba(255,160,120,.06)');
  spot.addColorStop(1, 'rgba(255,120,90,0)');
  ctx.fillStyle = spot;
  ctx.fillRect(0, 0, W, GROUND);

  var halo = ctx.createRadialGradient(W * 0.5, H * 0.28, 40, W * 0.5, H * 0.28, W * 0.6);
  halo.addColorStop(0, 'rgba(255,150,110,.22)');
  halo.addColorStop(0.6, 'rgba(255,120,90,.09)');
  halo.addColorStop(1, 'rgba(255,110,80,0)');
  ctx.fillStyle = halo;
  ctx.fillRect(0, H * 0.08, W, H * 0.42);

  var topDark = ctx.createLinearGradient(0, 0, 0, H * 0.35);
  topDark.addColorStop(0, 'rgba(0,0,0,.88)');
  topDark.addColorStop(0.72, 'rgba(0,0,0,.42)');
  topDark.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = topDark;
  ctx.fillRect(0, 0, W, H * 0.35);

  for (var i = 0; i < particles.length; i++) {
    var p = particles[i];
    if (p.size > 2.2) continue;
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1) * 0.8;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* водяной знак СТЕНДАП ПЕРМЬ */
function drawWatermark() {
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  var lines = ['СТЕНДАП', 'ПЕРМЬ'];
  var fs = Math.round(W * (PORTRAIT ? 0.135 : 0.088));
  ctx.font = '900 ' + fs + 'px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(255,225,210,.052)';
  ctx.strokeStyle = 'rgba(255,190,170,.035)';
  ctx.lineWidth = 2;
  var cy = H * (PORTRAIT ? 0.47 : 0.42);
  var step = fs * 1.02;
  for (var i = 0; i < lines.length; i++) {
    var y = cy + (i - (lines.length - 1) / 2) * step;
    ctx.fillText(lines[i], W / 2, y);
    ctx.strokeText(lines[i], W / 2, y);
  }
  ctx.restore();
}

function drawFloor() {
  var g = ctx.createLinearGradient(0, GROUND, 0, H);
  g.addColorStop(0, '#2a0a10');
  g.addColorStop(1, '#0b0406');
  ctx.fillStyle = g;
  ctx.fillRect(0, GROUND, W, H - GROUND);

  var poolG = ctx.createRadialGradient(W * 0.5, GROUND + 20, 40, W * 0.5, GROUND + 20, W * 0.55);
  poolG.addColorStop(0, 'rgba(255,190,150,.14)');
  poolG.addColorStop(1, 'rgba(255,190,150,0)');
  ctx.fillStyle = poolG;
  ctx.beginPath();
  ctx.ellipse(W * 0.5, GROUND + 26 * U, W * 0.5, 86 * U, 0, 0, 6.283);
  ctx.fill();

  var lineG = ctx.createLinearGradient(0, 0, W, 0);
  lineG.addColorStop(0, 'rgba(255,150,120,0)');
  lineG.addColorStop(0.5, 'rgba(255,170,140,.55)');
  lineG.addColorStop(1, 'rgba(255,150,120,0)');
  ctx.fillStyle = lineG;
  ctx.fillRect(0, GROUND - 2, W, 3);
}

function drawAudience(t) {
  for (var i = 0; i < audience.length; i++) {
    var a = audience[i];
    var bob = Math.sin(t * 1.7 + a.ph) * 2.6 * U;
    var lift = a.throwT > 0 ? -14 * U * (a.throwT / 0.28) : 0;
    ctx.save();
    ctx.translate(a.x, a.y + bob + lift);
    ctx.scale(a.s, a.s);
    ctx.fillStyle = '#2a0b12';
    ctx.beginPath(); ctx.ellipse(0, 52, 44, 30, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#210a10';
    ctx.beginPath(); ctx.arc(0, 0, 27, 0, 6.283); ctx.fill();
    ctx.strokeStyle = 'rgba(255,120,95,.85)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, 27, -2.55, -0.45); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,190,155,.35)';
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(0, 0, 24, -2.2, -0.8); ctx.stroke();
    ctx.fillStyle = 'rgba(255,215,190,.5)';
    ctx.beginPath(); ctx.arc(-9, -2, 3.1, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(9, -2, 3.1, 0, 6.283); ctx.fill();
    ctx.restore();
  }

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (var j = 0; j < bubbles.length; j++) {
    var b = bubbles[j];
    var k = b.life / b.max;
    ctx.globalAlpha = clamp(k * 1.4, 0, 1) * 0.85;
    var fs = Math.round(b.size);
    ctx.font = '800 ' + fs + 'px system-ui, sans-serif';
    var tw = ctx.measureText(b.text).width;
    var pad = 9 * U * 1.3;
    ctx.fillStyle = 'rgba(10,4,6,.72)';
    rr(b.x - tw / 2 - pad, b.y - fs * 0.85 - pad * 0.5, tw + pad * 2, fs * 1.55, 8);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,120,110,.28)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = '#e8c9c3';
    ctx.fillText(b.text, b.x, b.y);
  }
  ctx.globalAlpha = 1;
}

/* ============================================================
   ПРЕПЯТСТВИЯ
   ============================================================ */
function drawObstacle(o) {
  var y = GROUND, s = U * 1.15;
  ctx.fillStyle = 'rgba(0,0,0,.45)';
  ctx.beginPath();
  ctx.ellipse(o.x + o.w / 2, y + 8 * U, o.w * 0.62, 9 * U, 0, 0, 6.283);
  ctx.fill();

  ctx.save();
  ctx.translate(o.x + o.w / 2, y);
  ctx.scale(s, s);
  var w = o.w / s, h = o.h / s;

  if (o.type === 'mic') {
    ctx.fillStyle = '#20202a';
    rr(-22, -9, 44, 9, 4); ctx.fill();
    var poleG = ctx.createLinearGradient(-4, 0, 4, 0);
    poleG.addColorStop(0, '#6d6d7a'); poleG.addColorStop(0.5, '#c9c9d6'); poleG.addColorStop(1, '#5a5a66');
    ctx.fillStyle = poleG;
    ctx.fillRect(-4, -h, 8, h - 6);
    ctx.fillStyle = '#2a2a34';
    ctx.beginPath(); ctx.arc(0, -h - 2, 13, 0, 6.283); ctx.fill();
    ctx.fillStyle = 'rgba(255,120,100,.55)';
    ctx.beginPath(); ctx.arc(-3, -h - 6, 5, 0, 6.283); ctx.fill();
  } else if (o.type === 'chair') {
    ctx.fillStyle = '#3a1f27';
    rr(-w / 2, -h, w, 16, 5); ctx.fill();
    ctx.fillStyle = '#26141a';
    ctx.fillRect(-w / 2 + 8, -h + 16, 9, h - 16);
    ctx.fillRect(w / 2 - 17, -h + 16, 9, h - 16);
    ctx.fillStyle = 'rgba(255,150,120,.35)';
    ctx.fillRect(-w / 2, -h, w, 3);
  } else if (o.type === 'bottle') {
    ctx.fillStyle = '#0f2a1c';
    rr(-w / 2 + 5, -h, w - 10, h, 5); ctx.fill();
    ctx.fillStyle = '#12301f';
    rr(-3, -h - 14, 8, 18, 3); ctx.fill();
    ctx.fillStyle = 'rgba(120,255,190,.28)';
    rr(-w / 2 + 7, -h + 6, 5, h - 18, 3); ctx.fill();
    ctx.fillStyle = 'rgba(255,220,180,.6)';
    ctx.fillRect(-w / 2 + 5, -h * 0.55, w - 10, 12);
  } else {
    ctx.fillStyle = '#171720';
    rr(-w / 2, -h, w, h, 6); ctx.fill();
    ctx.fillStyle = '#0b0b12';
    ctx.beginPath(); ctx.arc(0, -h * 0.42, h * 0.26, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#2a2a38';
    ctx.beginPath(); ctx.arc(0, -h * 0.42, h * 0.15, 0, 6.283); ctx.fill();
    ctx.fillStyle = 'rgba(255,110,90,.7)';
    ctx.beginPath(); ctx.arc(w / 2 - 12, -h + 12, 3.4, 0, 6.283); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.08)';
    ctx.lineWidth = 1;
    rr(-w / 2 + 4, -h + 4, w - 8, h - 8, 4); ctx.stroke();
  }
  ctx.restore();
}

/* ============================================================
   СНАРЯДЫ
   ============================================================ */
function drawProjectile(p) {
  ctx.save();
  ctx.translate(p.x, p.y);

  if (p.kind === 'bubble') {
    ctx.rotate(p.rot);
    var fs = Math.round(20 * U * 1.35);
    ctx.font = '800 ' + fs + 'px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var tw = Math.max(ctx.measureText(p.text).width, 40 * U);
    var w = tw + 26 * U * 1.3, h = 44 * U * 1.3;
    ctx.fillStyle = 'rgba(255,240,225,.94)';
    ctx.beginPath();
    ctx.moveTo(-10 * U, h / 2 - 2);
    ctx.lineTo(10 * U, h / 2 - 2);
    ctx.lineTo(0, h / 2 + 16 * U);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    rr(-w / 2, -h / 2, w, h, 12); ctx.fill();
    ctx.strokeStyle = p.deflected ? '#ffe08a' : '#d63a2f';
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.fillStyle = '#1a0d0f';
    ctx.fillText(p.text, 0, 1);
  } else if (p.kind === 'tomato') {
    ctx.rotate(p.rot);
    var g = ctx.createRadialGradient(-6, -6, 4, 0, 0, p.r + 4);
    g.addColorStop(0, '#ff6b5e'); g.addColorStop(0.6, '#d82c22'); g.addColorStop(1, '#8c1109');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, p.r, 0, 6.283); ctx.fill();
    ctx.strokeStyle = 'rgba(255,180,160,.45)';
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(0, 0, p.r - 1, 0, 6.283); ctx.stroke();
    ctx.fillStyle = '#2f7a3a';
    for (var i = 0; i < 5; i++) {
      var a = i / 5 * 6.283;
      ctx.beginPath();
      ctx.ellipse(Math.cos(a) * 6, Math.sin(a) * 6 - 4, 5, 2.6, a, 0, 6.283);
      ctx.fill();
    }
  } else {
    ctx.rotate(p.rot);
    var gg = ctx.createLinearGradient(-p.r, 0, p.r, 0);
    gg.addColorStop(0, '#5c5c6a'); gg.addColorStop(0.4, '#c9cbd4');
    gg.addColorStop(0.7, '#8c8c98'); gg.addColorStop(1, '#4a4a56');
    ctx.fillStyle = gg;
    rr(-p.r * 0.8, -p.r * 1.25, p.r * 1.6, p.r * 2.5, 5); ctx.fill();
    ctx.fillStyle = 'rgba(255,120,110,.6)';
    ctx.fillRect(-p.r * 0.8, -p.r * 1.25, p.r * 1.6, 5);
  }

  if (p.deflected) {
    ctx.globalAlpha = 0.55;
    ctx.strokeStyle = '#ffe08a';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, p.r + 7, 0, 6.283); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

/* ============================================================
   ПЕРСОНАЖ
   ============================================================ */
var MIC_H = PDH * 0.42;
var MIC_W = MIC_H * (120 / 164);

function lerp(a, b, t) { return a + (b - a) * t; }

function gait() {
  var ph = player.runPhase;
  if (!player.onGround) {
    var v = clamp(player.vy / 900, -1, 1);
    return { thL: 0.55, thR: -0.25, knL: 0.9, knR: 0.5, bob: 0, arm: -0.7 + 0.3 * v };
  }
  var s = Math.sin(ph), c = Math.cos(ph);
  return {
    thL: 0.5 * s, thR: -0.5 * s,
    knL: 0.8 * Math.max(0, c), knR: 0.8 * Math.max(0, -c),
    bob: 2.2 * Math.abs(s),
    arm: -0.4 * s
  };
}

function limb(hx, hy, th, kn) {
  var kx = hx + 25 * Math.sin(th), ky = hy + 25 * Math.cos(th);
  var a2 = th - kn;
  return { kx: kx, ky: ky, ax: kx + 25 * Math.sin(a2), ay: ky + 25 * Math.cos(a2) };
}

function armPose(k) {
  var g = gait(), off = -g.bob;
  var a = lerp(0.2, 2.0, k), b = lerp(2.69, 1.4, k);
  var shU = { x: 19, y: -86 + off };
  var elU = { x: shU.x + 16 * Math.sin(a), y: shU.y + 16 * Math.cos(a) };
  var huU = { x: elU.x + 14 * Math.sin(b), y: elU.y + 14 * Math.cos(b) };
  var ang = 0.35 - 0.6 * k;
  var hand = { x: player.x + huU.x * S, y: player.feetY + huU.y * S };
  var d = MIC_H * 0.2;
  return {
    shU: shU, elU: elU, huU: huU, ang: ang, hand: hand,
    head: { x: hand.x + d * Math.sin(ang), y: hand.y - d * Math.cos(ang) }
  };
}

function drawCapeU(off, flap) {
  ctx.beginPath();
  ctx.moveTo(-12, -88 + off);
  ctx.quadraticCurveTo(-42 + flap, -72 + off, -46 + flap * 1.3, -40 + off + flap);
  ctx.quadraticCurveTo(-26, -24 + off, -8, -28);
  ctx.lineTo(12, -28);
  ctx.quadraticCurveTo(20, -50 + off, 13, -88 + off);
  ctx.closePath();
  var g = ctx.createLinearGradient(-40, 0, 14, 0);
  g.addColorStop(0, '#ef1d24');
  g.addColorStop(0.55, '#b5121b');
  g.addColorStop(1, '#7d0c12');
  ctx.fillStyle = g;
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,110,100,.45)';
  ctx.lineWidth = 0.9;
  ctx.stroke();
}

function drawLegU(hx, hy, p, side) {
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#2c2a36';
  ctx.lineWidth = 9;
  ctx.beginPath();
  ctx.moveTo(hx, hy); ctx.lineTo(p.kx, p.ky); ctx.lineTo(p.ax, p.ay);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(240,240,248,.95)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(hx + side * 3.2, hy); ctx.lineTo(p.kx + side * 3.2, p.ky); ctx.lineTo(p.ax + side * 3.2, p.ay);
  ctx.stroke();
  ctx.fillStyle = '#060509';
  ctx.beginPath();
  ctx.ellipse(p.ax + side * 2.2, p.ay + 1.2, 6, 3.4, 0, 0, 6.283);
  ctx.fill();
  ctx.fillStyle = 'rgba(240,240,245,.85)';
  ctx.fillRect(p.ax + side * 2.2 - 6, p.ay + 2.6, 12, 1.1);
}

function drawJacketU(off) {
  ctx.fillStyle = '#2a2833';
  ctx.beginPath();
  ctx.moveTo(-9, -90 + off);
  ctx.lineTo(-19, -88 + off);
  ctx.lineTo(-22, -74 + off);
  ctx.lineTo(-19, -50 + off);
  ctx.lineTo(19, -50 + off);
  ctx.lineTo(22, -74 + off);
  ctx.lineTo(19, -88 + off);
  ctx.lineTo(9, -90 + off);
  ctx.lineTo(0, -78 + off);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(225,225,235,.7)';
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.moveTo(-9, -90 + off); ctx.lineTo(-19, -88 + off); ctx.lineTo(-22, -74 + off); ctx.lineTo(-19, -50 + off);
  ctx.moveTo(9, -90 + off); ctx.lineTo(19, -88 + off); ctx.lineTo(22, -74 + off); ctx.lineTo(19, -50 + off);
  ctx.stroke();

  ctx.fillStyle = '#f1f1f5';
  ctx.beginPath();
  ctx.moveTo(-7, -90 + off); ctx.lineTo(7, -90 + off); ctx.lineTo(0, -74 + off);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#0c0b10';
  ctx.beginPath();
  ctx.moveTo(-2.2, -88 + off); ctx.lineTo(2.2, -88 + off);
  ctx.lineTo(3.2, -72 + off); ctx.lineTo(0, -64 + off); ctx.lineTo(-3.2, -72 + off);
  ctx.closePath();
  ctx.fill();
}

function drawArmU(sh, el, hu) {
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#2a2833';
  ctx.lineWidth = 6.5;
  ctx.beginPath();
  ctx.moveTo(sh.x, sh.y); ctx.lineTo(el.x, el.y); ctx.lineTo(hu.x, hu.y);
  ctx.stroke();
  ctx.fillStyle = '#d9a686';
  ctx.beginPath();
  ctx.arc(hu.x, hu.y, 3.3, 0, 6.283);
  ctx.fill();
}

var LOGO_AR = 224 / 240;   /* пропорции вырезанного стикера */

function drawNeckHeadU(off) {
  /* шея */
  ctx.fillStyle = '#c88f6c';
  ctx.fillRect(-4.5, -94 + off, 9, 8);

  /* голова целиком — логотип, пропорции сохранены */
  var hw = 20, hh = hw * 2 * LOGO_AR;   /* полная высота = ширина * пропорции */
  var cy = -106 + off;

  /* мягкое свечение, чтобы стикер читался на тёмном фоне */
  var halo = ctx.createRadialGradient(0, cy, hw * 0.5, 0, cy, hw * 1.85);
  halo.addColorStop(0, 'rgba(255,240,225,.26)');
  halo.addColorStop(1, 'rgba(255,240,225,0)');
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(0, cy, hw * 1.85, 0, 6.283); ctx.fill();

  ctx.drawImage(IMG.logo, -hw, cy - hh / 2, hw * 2, hh);
}

function drawPlayer(t) {
  if (player.inv > 0 && Math.floor(player.inv * 14) % 2 === 0) return;

  var g = gait(), off = -g.bob;
  var flap = player.onGround ? Math.sin(player.runPhase * 0.5) * 2.2 : 3;
  var k = player.swing > 0 ? Math.sin((1 - player.swing / 0.22) * Math.PI) : 0;
  var pose = armPose(k);
  var hipY = -50 + off;
  var legL = limb(-7, hipY, g.thL, g.knL);
  var legR = limb(7, hipY, g.thR, g.knR);

  var free = { x: -19, y: -86 + off };
  var freeEl = { x: free.x + 16 * Math.sin(g.arm), y: free.y + 16 * Math.cos(g.arm) };
  var freeHu = { x: freeEl.x + 14 * Math.sin(g.arm + 0.4), y: freeEl.y + 14 * Math.cos(g.arm + 0.4) };

  var shadowK = clamp(1 - (GROUND - player.feetY) / (320 * U), 0.25, 1);
  ctx.fillStyle = 'rgba(0,0,0,.45)';
  ctx.beginPath();
  ctx.ellipse(player.x, GROUND + 6 * U, PDW * 0.5 * shadowK, 8 * U * shadowK, 0, 0, 6.283);
  ctx.fill();

  ctx.save();
  ctx.translate(player.x, player.feetY);
  ctx.scale(S, S);
  drawCapeU(off, flap);
  drawLegU(-7, hipY, legL, -1);
  drawLegU(7, hipY, legR, 1);
  drawJacketU(off);
  drawArmU(free, freeEl, freeHu);
  drawArmU(pose.shU, pose.elU, pose.huU);
  drawNeckHeadU(off);
  ctx.restore();

  ctx.save();
  ctx.translate(pose.hand.x, pose.hand.y);
  ctx.rotate(pose.ang);
  ctx.drawImage(IMG.mic, -MIC_W / 2, -MIC_H * 0.7, MIC_W, MIC_H);
  ctx.restore();

  if (player.swing > 0) {
    var kk = player.swing / 0.22;
    ctx.save();
    ctx.globalAlpha = kk * 0.9;
    ctx.lineCap = 'round';
    for (var i = 0; i < 3; i++) {
      ctx.strokeStyle = ['rgba(255,240,200,.95)', 'rgba(255,190,120,.65)', 'rgba(255,120,90,.35)'][i];
      ctx.lineWidth = [10, 18, 26][i] * kk * U;
      ctx.beginPath();
      ctx.arc(pose.hand.x, pose.hand.y, (60 + i * 8) * U, -1.45, 0.45);
      ctx.stroke();
    }
    ctx.restore();
  }
}

function drawHearts(x, y, r, alive) {
  ctx.save();
  ctx.translate(x, y);
  ctx.beginPath();
  ctx.moveTo(0, r * 0.85);
  ctx.bezierCurveTo(-r * 1.5, -r * 0.25, -r * 0.62, -r * 1.15, 0, -r * 0.42);
  ctx.bezierCurveTo(r * 0.62, -r * 1.15, r * 1.5, -r * 0.25, 0, r * 0.85);
  ctx.closePath();
  if (alive) {
    var g = ctx.createLinearGradient(0, -r, 0, r);
    g.addColorStop(0, '#ff7b6b'); g.addColorStop(1, '#c1121f');
    ctx.fillStyle = g; ctx.fill();
  } else {
    ctx.strokeStyle = 'rgba(255,120,110,.28)'; ctx.lineWidth = 2; ctx.stroke();
  }
  ctx.restore();
}

function drawHUD() {
  var m = 34 * U;
  ctx.save();
  ctx.textBaseline = 'top';
  ctx.textAlign = 'left';
  var score = String(Math.floor(state.score)).padStart(4, '0');
  ctx.font = '900 ' + Math.round(46 * U) + 'px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillText(score, m + 2, m - 2);
  ctx.fillStyle = '#ffe9d6'; ctx.fillText(score, m, m - 4);

  ctx.font = '700 ' + Math.round(14 * U) + 'px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(255,200,180,.55)';
  ctx.fillText('СМЕХ', m, m + 46 * U);

  for (var i = 0; i < state.maxHp; i++) {
    drawHearts(m + 11 * U + i * 34 * U, m + 80 * U, 11 * U, i < state.hp);
  }

  if (state.combo > 1) {
    var a = clamp(state.comboTimer / 2.6, 0, 1);
    ctx.globalAlpha = 0.45 + a * 0.55;
    ctx.font = '900 ' + Math.round(30 * U) + 'px system-ui, sans-serif';
    ctx.fillStyle = '#ffe08a';
    ctx.fillText('x' + state.combo, m, m + 118 * U);
    ctx.font = '800 ' + Math.round(12 * U) + 'px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,224,138,.7)';
    ctx.fillText('СЕРИЯ ОТБИТЫХ', m, m + 152 * U);
    ctx.globalAlpha = 1;
  }

  ctx.textAlign = 'right';
  ctx.font = '700 ' + Math.round(14 * U) + 'px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(255,200,180,.5)';
  ctx.fillText('РЕКОРД', W - m, m - 4);
  ctx.font = '900 ' + Math.round(26 * U) + 'px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(255,233,214,.72)';
  ctx.fillText(String(Math.floor(state.best)), W - m, m + 16 * U);

  ctx.textAlign = 'center';
  ctx.font = '800 ' + Math.round(15 * U) + 'px system-ui, sans-serif';
  var bw = 98 * U, bh = 34 * U;
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  rr(W - m - bw, m + 66 * U, bw, bh, 9 * U); ctx.fill();
  ctx.fillStyle = 'rgba(255,220,200,.55)';
  ctx.textBaseline = 'middle';
  ctx.fillText(muted ? 'ЗВУК ВЫКЛ' : 'ЗВУК', W - m - bw / 2, m + 66 * U + bh / 2);

  if (state.time < 7) {
    var ha = state.time < 1 ? state.time : clamp((7 - state.time) / 2, 0, 1);
    var hint = PORTRAIT ? 'ЛЕВАЯ ЧАСТЬ — ПРЫЖОК · ПРАВАЯ — МИКРОФОН' : 'ПРОБЕЛ — прыжок   ·   ↓ — удар микрофоном';
    ctx.globalAlpha = ha * 0.85;
    ctx.font = '700 ' + Math.round(16 * U) + 'px system-ui, sans-serif';
    var hw = Math.min(W * 0.92, ctx.measureText(hint).width + 40 * U);
    ctx.fillStyle = 'rgba(20,10,12,.75)';
    rr(W / 2 - hw / 2, GROUND - 236 * U, hw, 40 * U, 10 * U); ctx.fill();
    ctx.fillStyle = '#ffe2cf';
    ctx.fillText(hint, W / 2, GROUND - 216 * U);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

   ЭКРАНЫ

function drawCenteredText(text, y, maxW, size, weight, fill, stroke) {
  ctx.font = weight + ' ' + size + 'px system-ui, sans-serif';
  var s = size;
  while (ctx.measureText(text).width > maxW && s > 10) {
    s -= 2;
    ctx.font = weight + ' ' + s + 'px system-ui, sans-serif';
  }
  if (stroke) { ctx.lineWidth = 10 * U; ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.strokeText(text, W / 2, y); }
  ctx.fillStyle = fill;
  ctx.fillText(text, W / 2, y);
}

function drawStart(t) {
  ctx.fillStyle = 'rgba(6,3,5,.72)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  var titleY = H * (PORTRAIT ? 0.2 : 0.3);
  var g = ctx.createLinearGradient(0, titleY - 50 * U, 0, titleY + 50 * U);
  g.addColorStop(0, '#ffe9d6'); g.addColorStop(1, '#ff5a4a');
  ctx.fillStyle = g;
  var tsize = Math.min(96 * U, W * 0.13);

    tsize -= 2; ctx.font = '900 ' + tsize + 'px system-ui, sans-serif';
  }
  ctx.lineWidth = 12 * U; ctx.strokeStyle = 'rgba(0,0,0,.65)';

  var rows = PORTRAIT
    ? [['ЛЕВАЯ ЧАСТЬ', 'прыжок'], ['ПРАВАЯ ЧАСТЬ', 'удар микрофоном'], ['КНОПКИ', 'внизу экрана']]
    : [['ПРОБЕЛ / ↑', 'прыжок через реквизит'], ['↓ / S', 'удар микрофоном'], ['P', 'пауза']];
  ctx.font = '700 ' + Math.round(20 * U) + 'px system-ui, sans-serif';

  ctx.globalAlpha = 1;

  drawCenteredText('рекорд: ' + Math.floor(state.best), H * 0.7 + 50 * U, W * 0.9, 15 * U, '700', 'rgba(255,200,180,.4)');
}

function drawOver(t) {

function drawPause() {

  ctx.textBaseline = 'middle';

  drawCenteredText(PORTRAIT ? 'тапни — продолжить' : 'P — продолжить', H / 2 + 44 * U, W * 0.8, 20 * U, '700', 'rgba(255,205,190,.7)');
}

   ЦИКЛ
   ============================================================ */
function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);

  var sx = 0, sy = 0;
  if (state.shake > 0.4) {
    sx = rand(-state.shake, state.shake) * 0.5;
    sy = rand(-state.shake, state.shake) * 0.5;
  }
  ctx.save();
  ctx.translate(sx, sy);
  drawBackground(t);
  drawWatermark();
  drawAudience(t);
  drawFloor();
  for (var i = 0; i < obstacles.length; i++) drawObstacle(obstacles[i]);
  for (var j = 0; j < projectiles.length; j++) drawProjectile(projectiles[j]);
  drawPlayer(t);
  for (var k = 0; k < particles.length; k++) {
    var p = particles[k];
    if (p.size <= 2.2) continue;
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * ctx.globalAlpha, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (var fi = 0; fi < floats.length; fi++) {
    var f = floats[fi];
    ctx.globalAlpha = clamp((f.life / f.max) * 1.6, 0, 1);
    ctx.font = '900 ' + Math.round(f.size) + 'px system-ui, sans-serif';
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,.6)';
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  if (state.flash > 0) {
    ctx.fillStyle = 'rgba(200,20,20,' + (state.flash * 0.4) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  var vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.36, W / 2, H / 2, Math.max(W, H) * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,.62)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  if (state.mode === 'play' || state.mode === 'pause') drawHUD();
  if (state.mode === 'start') drawStart(t);
  if (state.mode === 'over') drawOver(t);
  if (state.mode === 'pause') drawPause();
}

var last = performance.now();
function frame(now) {
  var dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  update(dt);
  render(now / 1000);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
